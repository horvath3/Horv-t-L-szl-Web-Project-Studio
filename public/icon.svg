<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d111d" />
      <stop offset="50%" stop-color="#080a0f" />
      <stop offset="100%" stop-color="#131728" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#6366f1" stroke-opacity="0.28" stroke-width="4" />

  <!-- Subtle Grid Glow -->
  <circle cx="256" cy="220" r="160" fill="#6366f1" fill-opacity="0.14" filter="url(#glow)" />

  <!-- Layered Studio Isometric Emblem -->
  <g transform="translate(0, -10)">
    <!-- Bottom Layer -->
    <path d="M116 324 L256 394 L396 324" fill="none" stroke="url(#accentGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" opacity="0.65" />
    <!-- Middle Layer -->
    <path d="M116 262 L256 332 L396 262" fill="none" stroke="url(#primaryGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" opacity="0.88" />
    <!-- Top Diamond -->
    <polygon points="256,122 116,192 256,262 396,192" fill="url(#primaryGrad)" stroke="#e0e7ff" stroke-width="6" stroke-linejoin="round" />
  </g>

  <!-- Status Dot (Active Studio Emerald Dot) -->
  <circle cx="396" cy="122" r="20" fill="#10b981" stroke="#080a0f" stroke-width="8" />
</svg>
